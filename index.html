:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #F6F7F5; --surface: #FFFFFF; --ink: #1F2328; --ink-2: #58616A; --line: #DADFE2;
  --accent: #1D5FA8; --accent-ink: #FFFFFF;
  --ok: #2F6E43; --warn: #855A0B; --bad: #A3203A;
  --ok-bg: #DCEEE1; --warn-bg: #F4E8CF; --bad-bg: #F5DEE3;
  --prep: #5E666C; --prep-bg: #E6E9EA;
  --fuerza: #A3203A; --fuerza-bg: #F5DEE3;
  --hiper: #1D5FA8; --hiper-bg: #DDE8F5;
  --control: #855A0B; --control-bg: #F4E8CF;
  --aero: #2F6E43; --aero-bg: #DCEEE1;
  --ecc: #1D5FA8; --con: #A3203A; --pau: #C9CFD3; --old: #7A5236;
  --font: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121A2A; --surface: #182338; --ink: #E9EDF2; --ink-2: #A6B0BD; --line: #2A3852;
    --accent: #7FB2F0; --accent-ink: #0E1626;
    --ok: #86CC9A; --warn: #E5B55C; --bad: #F0708A;
    --ok-bg: #1D3A2E; --warn-bg: #3A301C; --bad-bg: #3A1F33;
    --prep: #A7B0B8; --prep-bg: #243047;
    --fuerza: #F0708A; --fuerza-bg: #3A1F33;
    --hiper: #7FB2F0; --hiper-bg: #1C3354;
    --control: #E5B55C; --control-bg: #3A301C;
    --aero: #86CC9A; --aero-bg: #1D3A2E;
    --ecc: #7FB2F0; --con: #F0708A; --pau: #3A4A66; --old: #C9946B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121A2A; --surface: #182338; --ink: #E9EDF2; --ink-2: #A6B0BD; --line: #2A3852;
  --accent: #7FB2F0; --accent-ink: #0E1626;
  --ok: #86CC9A; --warn: #E5B55C; --bad: #F0708A;
  --ok-bg: #1D3A2E; --warn-bg: #3A301C; --bad-bg: #3A1F33;
  --prep: #A7B0B8; --prep-bg: #243047;
  --fuerza: #F0708A; --fuerza-bg: #3A1F33;
  --hiper: #7FB2F0; --hiper-bg: #1C3354;
  --control: #E5B55C; --control-bg: #3A301C;
  --aero: #86CC9A; --aero-bg: #1D3A2E;
  --ecc: #7FB2F0; --con: #F0708A; --pau: #3A4A66; --old: #C9946B;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 140px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.55; font-stretch: 100%; }
body.playing { overflow: hidden; }
img { max-width: 100%; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.k { font-weight: 700; }
.muted { color: var(--ink-2); margin: 0 0 12px; font-size: 15px; }
.mini { margin: 14px 0 6px; font-size: 16px; font-weight: 700; }
.tone-prep { --tc: var(--prep); --tb: var(--prep-bg); }
.tone-fuerza { --tc: var(--fuerza); --tb: var(--fuerza-bg); }
.tone-hiper { --tc: var(--hiper); --tb: var(--hiper-bg); }
.tone-control { --tc: var(--control); --tb: var(--control-bg); }
.tone-aero { --tc: var(--aero); --tb: var(--aero-bg); }

/* Cabecera */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 780px; margin: 0 auto; padding: 10px 16px 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px; }
.brand b { font-stretch: 75%; font-weight: 800; font-size: 20px; }
.brand span { color: var(--ink-2); font-size: 15px; }
.tabs { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.tab { position: relative; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; padding: 6px 8px 5px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; text-align: left; min-height: 50px; }
.tab.rest { background: transparent; border-style: dashed; }
.tab-d { font-stretch: 75%; font-weight: 750; font-size: 19px; line-height: 1.1; }
.tab-m { max-width: 100%; font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab-hoy { position: absolute; top: 5px; right: 7px; font-size: 11px; font-weight: 700; color: var(--fuerza); }
.tab-ok { position: absolute; bottom: 4px; right: 7px; font-size: 14px; font-weight: 800; color: var(--ok); }
.tab.on { background: var(--ink); color: var(--bg); border-color: var(--ink); border-style: solid; }
.tab.on .tab-m, .tab.on .tab-hoy, .tab.on .tab-ok { color: inherit; }
.tab.on .tab-m { opacity: 0.75; }

main, .global { max-width: 780px; margin: 0 auto; padding: 0 18px; }
.global { padding-bottom: 56px; }

/* Portada del día */
.hero { padding: 26px 0 6px; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0 0 6px; font-size: 16px; color: var(--ink-2); }
.hm-day { color: var(--ink); font-weight: 700; }
.hero-title { margin: 0 0 12px; font-stretch: 72%; font-weight: 800; font-size: clamp(34px, 8vw, 56px); line-height: 1.0; max-width: 18ch; }
.hero-lead { margin: 0 0 16px; max-width: 62ch; font-size: 18px; }
.status { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
.chip { display: inline-flex; align-items: center; min-height: 34px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 650; color: var(--ink); text-decoration: none; }
.chip.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.toggle { cursor: pointer; }
.chip.toggle.on { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 0; }
.btn { min-height: 50px; padding: 0 20px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 650; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.quiet { background: transparent; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary:hover { filter: brightness(1.08); }
.banner { margin: 16px 0 0; padding: 12px 14px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-weight: 650; }
.extra { margin: 22px 0 0; color: var(--ink-2); font-size: 15px; max-width: 64ch; }
.next-day { margin: 22px 0 0; padding: 14px 16px; border-radius: 12px; background: var(--prep-bg); }
.link { border: 0; background: none; padding: 0 0 0 6px; color: var(--accent); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* Recorrido */
.route-wrap { padding: 22px 0 4px; }
.sec-title { margin: 0 0 10px; font-stretch: 80%; font-weight: 750; font-size: 22px; line-height: 1.2; }
.route { display: flex; gap: 3px; width: 100%; }
.seg { position: relative; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; height: 72px; padding: 7px 6px 6px; border-radius: 6px; background: var(--tb); color: var(--tc); text-decoration: none; overflow: hidden; border-bottom: 5px solid var(--tc); }
a.seg:hover { outline: 2px solid var(--tc); outline-offset: 1px; }
.seg-l { font-stretch: 65%; font-weight: 800; font-size: 21px; line-height: 1; white-space: nowrap; }
.seg-t { font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; opacity: 0.9; }
.route-end { margin: 6px 0 0; text-align: right; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* Tarjetas */
.card { margin: 22px 0 0; padding: 18px 18px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.card > summary { cursor: pointer; font-stretch: 80%; font-weight: 750; font-size: 20px; }
.card[open] > summary { margin-bottom: 10px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.cols .mini { margin-top: 0; }
.checks, .plain { list-style: none; margin: 0; padding: 0; }
.checks li { margin: 0 0 7px; }
.checks label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; font-size: 16px; line-height: 1.4; }
.checks input { width: 20px; height: 20px; margin: 1px 0 0; flex: none; accent-color: var(--accent); }
.checks input:checked + span { color: var(--ink-2); text-decoration: line-through; text-decoration-color: var(--line); }
.signals input:checked + span { text-decoration: none; color: var(--warn); font-weight: 650; }
.plain li { padding: 7px 0; border-bottom: 1px solid var(--line); }
.plain li:last-child { border-bottom: 0; }
.log { margin: 12px 0 0; font-weight: 650; color: var(--ok); }

/* Hoy sí / Evita */
.sino { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px; }
.sino .mini { margin-top: 4px; }
ul.yes, ul.no { list-style: none; margin: 0; padding: 0; }
ul.yes li, ul.no li { position: relative; padding: 5px 0 5px 28px; font-size: 16px; line-height: 1.4; }
ul.yes li::before, ul.no li::before { position: absolute; left: 0; top: 4px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; }
ul.yes li::before { content: "✓"; background: var(--ok-bg); color: var(--ok); }
ul.no li::before { content: "✕"; background: var(--bad-bg); color: var(--bad); }

/* Filtro y chequeos */
.fs { border: 0; margin: 0 0 12px; padding: 0; min-width: 0; }
.fs legend { font-weight: 650; margin-bottom: 6px; padding: 0; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; font-size: 16px; background: var(--surface); }
.opt input { accent-color: var(--accent); margin: 0; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--hiper-bg); }
.filter-out, .check-out { margin: 6px 0 0; padding: 12px 14px; border-radius: 10px; background: var(--prep-bg); font-weight: 650; }
.check-out:empty { display: none; }
.filter-out.ok { background: var(--ok-bg); color: var(--ok); }
.filter-out.mod { background: var(--warn-bg); color: var(--warn); }
.filter-out.stop { background: var(--bad-bg); color: var(--bad); }
.check { border-left: 5px solid var(--accent); }
.check .btn { margin-top: 4px; }
.check-done { border-left: 5px solid var(--tc, var(--line)); }
.check-done.ok { --tc: var(--ok); } .check-done.warn { --tc: var(--warn); } .check-done.bad { --tc: var(--bad); }
.adv { margin: 8px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--prep-bg); font-weight: 600; }
.adv.ok { background: var(--ok-bg); color: var(--ok); }
.adv.warn { background: var(--warn-bg); color: var(--warn); }
.adv.bad { background: var(--bad-bg); color: var(--bad); }

/* Bloques */
.block { margin: 30px 0 0; padding-left: 16px; border-left: 4px solid var(--tc); }
.block-head { display: flex; gap: 14px; align-items: flex-start; }
.block-id { flex: none; min-width: 46px; font-stretch: 62%; font-weight: 800; font-size: 44px; line-height: 0.9; color: var(--tc); }
.block-name { margin: 0; font-stretch: 80%; font-weight: 780; font-size: 25px; line-height: 1.15; }
.block-time { margin: 2px 0 0; font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 15px; }
.bt-len { margin-left: 10px; padding: 1px 8px; border-radius: 999px; background: var(--tb, var(--prep-bg)); color: var(--tc, var(--prep)); font-weight: 650; font-size: 13px; white-space: nowrap; }
.block-format { margin: 12px 0 6px; font-weight: 650; }
.block-note { margin: 8px 0 10px; padding: 10px 12px; border-radius: 8px; background: var(--tb, var(--warn-bg)); color: var(--ink); font-size: 15px; }
.items { list-style: none; margin: 12px 0 0; padding: 0; counter-reset: it; }
.items li { padding: 10px 0; border-top: 1px solid var(--line); counter-increment: it; }
.it-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.it-name { font-weight: 700; }
.it-name::before { content: counter(it); color: var(--tc, var(--prep)); font-stretch: 70%; font-weight: 800; margin-right: 10px; }
.it-dose { flex: none; font-variant-numeric: tabular-nums; color: var(--tc, var(--prep)); font-weight: 700; }
.it-how { margin: 2px 0 0; color: var(--ink-2); font-size: 15px; }

/* Ejercicio */
.ex { margin: 14px 0 0; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.ex-head { display: flex; align-items: baseline; gap: 12px; }
.ex-code { font-stretch: 65%; font-weight: 800; font-size: 28px; color: var(--tc); line-height: 1; flex: none; }
.ex-name { margin: 0; font-size: 20px; font-weight: 750; line-height: 1.25; }
.ex-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
.knee { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 8px; border-radius: 999px; font-size: 13px; font-weight: 700; }
.knee i { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.knee.k0 { background: var(--ok-bg); color: var(--ok); }
.knee.k1 { background: var(--prep-bg); color: var(--prep); }
.knee.k2 { background: var(--warn-bg); color: var(--warn); }
.mus { padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.ex-rx { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 8px; margin: 14px 0 10px; }
.ex-rx div { padding: 8px 10px; border-radius: 8px; background: var(--tb); }
.ex-rx dt { font-size: 13px; color: var(--ink-2); }
.ex-rx dd { margin: 0; font-weight: 750; font-variant-numeric: tabular-nums; font-size: 16px; line-height: 1.3; }
.ex-why { margin: 10px 0 8px; max-width: 64ch; }
.ex-how summary, .ex-ladder summary { cursor: pointer; font-weight: 700; color: var(--accent); padding: 4px 0; }
.how { padding-top: 6px; max-width: 64ch; }
.how p { margin: 0 0 8px; }
.steps { margin: 0 0 10px; padding-left: 24px; }
.steps li { margin: 0 0 4px; }

/* Barra de tempo */
.tbar { display: flex; gap: 3px; margin: 6px 0 10px; min-height: 30px; }
.tb { display: flex; align-items: center; gap: 4px; min-width: 0; padding: 4px 8px; border-radius: 6px; font-size: 13px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb b { font-stretch: 70%; font-size: 16px; font-weight: 800; }
.tb.ecc { background: var(--hiper-bg); color: var(--ecc); }
.tb.con { background: var(--fuerza-bg); color: var(--con); }
.tb.pau { background: var(--prep-bg); color: var(--ink-2); }
.tb.xp b { letter-spacing: 0.02em; }
.tbar.big { min-height: 46px; }
.tbar.big .tb { font-size: 16px; padding: 6px 10px; }
.tbar.big .tb b { font-size: 22px; }
.tb.now { outline: 3px solid currentColor; outline-offset: -3px; }
.tb.ecc.now { background: var(--ecc); color: var(--surface); }
.tb.con.now { background: var(--con); color: var(--surface); }
.tb.pau.now { background: var(--ink-2); color: var(--surface); }

/* Progreso */
.prog { margin: 6px 0 4px; padding: 10px 12px; border-radius: 8px; border: 1px dashed var(--line); font-size: 15px; }
.prog p { margin: 0 0 4px; }
.prog p:last-child { margin-bottom: 0; }
.pg-up { color: var(--ok); font-weight: 650; }
.pg-down { color: var(--bad); font-weight: 650; }
.pg-hold { color: var(--ink-2); }
.pg-note { font-size: 13px; color: var(--ink-2); font-weight: 400; }
.mini-btn { min-height: 32px; margin-left: 6px; padding: 2px 12px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-size: 14px; font-weight: 700; cursor: pointer; }
.mini-btn.quiet { background: transparent; color: var(--accent); }
.ladder { margin: 6px 0 8px; padding: 0; list-style: none; counter-reset: rg; }
.ladder li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0 7px 32px; border-bottom: 1px solid var(--line); counter-increment: rg; position: relative; }
.ladder li::before { content: counter(rg); position: absolute; left: 0; top: 7px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--prep-bg); color: var(--ink-2); }
.ladder li.past { color: var(--ink-2); }
.ladder li.past::before { content: "✓"; background: var(--ok-bg); color: var(--ok); }
.ladder li.cur { font-weight: 750; }
.ladder li.cur::before { background: var(--accent); color: var(--accent-ink); }
.ladder em { font-style: normal; font-size: 13px; color: var(--accent); white-space: nowrap; }

/* Caminata y segmentos */
.walk { list-style: none; margin: 12px 0 12px; padding: 0; display: grid; gap: 4px; }
.walk li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 12px; border-radius: 8px; font-variant-numeric: tabular-nums; }
.walk .w-fast { background: var(--fuerza-bg); color: var(--fuerza); font-weight: 700; }
.walk .w-norm { background: var(--prep-bg); color: var(--prep); }
.routine { border-top: 5px solid var(--tc); }

/* Seguimiento semanal */
.auto { padding: 10px 12px; border-radius: 8px; background: var(--prep-bg); margin: 0 0 14px; }
.auto p { margin: 0 0 4px; }
.grid-in { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px 14px; margin: 0 0 14px; }
.num { display: flex; flex-direction: column; gap: 4px; font-size: 15px; font-weight: 600; }
.num input { min-height: 46px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 18px; font-variant-numeric: tabular-nums; }
.review-out { margin: 12px 0 0; }
.tscroll { overflow-x: auto; }
.hist { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
.hist th, .hist td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
.hist th { color: var(--ink-2); font-weight: 650; }
.spark { margin: 4px 0 10px; color: var(--accent); }
.spark figcaption { font-size: 13px; color: var(--ink-2); }

/* Ajustes y datos */
.set-grid { display: grid; gap: 4px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.switch { display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 4px 12px 4px 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); cursor: pointer; font-weight: 700; flex: none; }
.switch i { width: 28px; height: 28px; border-radius: 50%; background: var(--line); transition: background 0.15s; }
.switch[aria-checked="true"] { border-color: var(--ok); color: var(--ok); }
.switch[aria-checked="true"] i { background: var(--ok); }
.opt-btn { min-height: 38px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; font-weight: 650; font-size: 15px; }
.opt-btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.sync { font-size: 14px; font-weight: 650; color: var(--ink-2); }
.sync.cloud { color: var(--ok); }
.sync.full { color: var(--bad); }
.io { width: 100%; margin: 12px 0 8px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 13px; line-height: 1.4; resize: vertical; }
.rules { margin: 0; }
.rules div { padding: 10px 0; border-top: 1px solid var(--line); }
.rules dt { font-weight: 700; }
.rules dd { margin: 2px 0 0; color: var(--ink-2); }
.tones { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 15px; }
.tones li { display: flex; align-items: center; gap: 8px; }
.sw { width: 18px; height: 18px; border-radius: 4px; background: var(--tb); border-bottom: 4px solid var(--tc); }

/* Modo guiado */
.player { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.player[hidden] { display: none; }
.p-top { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; max-width: 860px; width: 100%; margin: 0 auto; padding: 10px 16px 6px; }
.p-mid { text-align: center; min-width: 0; }
.p-top > *, .p-bottom > *, .p-body > * { min-width: 0; }
.p-name { margin: 0; font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-clock { font-variant-numeric: tabular-nums; }
.p-el { font-stretch: 70%; font-weight: 800; font-size: 28px; line-height: 1.1; }
.p-plan { margin-left: 6px; color: var(--ink-2); font-size: 14px; }
.p-status { margin: 0; font-size: 13px; font-weight: 650; min-height: 1.2em; }
.p-status.late { color: var(--bad); } .p-status.early { color: var(--accent); } .p-status.ok { color: var(--ok); }
.p-tools { display: flex; gap: 6px; }
.pbtn { min-height: 46px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 650; cursor: pointer; font-size: 15px; }
.pbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pbtn.sq { width: 46px; padding: 0; font-size: 22px; }
.pbtn.quiet { background: transparent; }
.pbtn[hidden] { display: none; }
.p-route { position: relative; max-width: 860px; width: 100%; margin: 0 auto; padding: 4px 16px 10px; }
.p-route[hidden] { display: none; }
.p-route .seg { height: 28px; padding: 3px 4px; border-bottom-width: 3px; opacity: 0.5; }
.p-route .seg.cur { opacity: 1; }
.p-route .seg-l { font-size: 14px; }
.p-route .seg-t { display: none; }
.p-marker { position: absolute; top: 0; bottom: 6px; width: 3px; margin-left: -1.5px; background: var(--ink); border-radius: 2px; left: 16px; transition: left 0.2s linear; pointer-events: none; }
.p-body { min-height: 0; overflow-y: auto; max-width: 860px; width: 100%; margin: 0 auto; padding: 6px 20px 16px; }
.p-kind { margin: 6px 0 4px; font-weight: 700; color: var(--tc); font-size: 15px; }
.p-title { margin: 0; font-stretch: 72%; font-weight: 800; font-size: clamp(30px, 6.5vw, 50px); line-height: 1.02; }
.p-sub { margin: 8px 0 0; font-size: 18px; color: var(--ink-2); }
.p-dose { display: block; color: var(--ink); font-weight: 750; font-size: 24px; margin-top: 2px; }
.p-side { display: block; margin-top: 4px; font-size: 16px; font-weight: 650; color: var(--tc); }
.p-count { margin: 8px 0 4px; font-stretch: 62%; font-weight: 800; font-variant-numeric: tabular-nums; font-size: clamp(104px, 28vw, 220px); line-height: 0.9; color: var(--tc); }
.p-count.empty { display: none; }
.p-count.idle { color: var(--ink-2); }
.p-count.lead { color: var(--ink); }
.t-rest .p-count, .t-wait .p-count, .t-gap .p-count { color: var(--accent); }
.t-rest .p-kind, .t-wait .p-kind, .t-gap .p-kind { color: var(--accent); }
.p-pacer { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 6px 18px; margin: 12px 0 4px; }
.p-pacer[hidden] { display: none; }
.pc-rep { display: flex; flex-direction: column; align-items: center; min-width: 120px; }
.pc-rep span { font-size: 14px; color: var(--ink-2); font-weight: 650; }
.pc-rep b { font-stretch: 62%; font-weight: 800; font-size: clamp(88px, 22vw, 160px); line-height: 0.9; color: var(--tc); font-variant-numeric: tabular-nums; }
.pc-ph { position: relative; padding: 12px 16px 18px; border-radius: 12px; background: var(--prep-bg); overflow: hidden; }
.pc-ph b { font-stretch: 72%; font-weight: 800; font-size: clamp(36px, 8vw, 64px); line-height: 1; }
.pc-ph i { position: absolute; left: 0; bottom: 0; height: 8px; background: currentColor; transition: width 0.03s linear; }
.pc-ph.ecc { background: var(--hiper-bg); color: var(--ecc); }
.pc-ph.con { background: var(--fuerza-bg); color: var(--con); }
.pc-ph.pau { color: var(--ink-2); }
.pc-done { grid-column: 1 / -1; margin: 0; font-size: 15px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.p-rx { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 8px; }
.p-rx div { padding: 8px 12px; border-radius: 8px; background: var(--tb); }
.p-rx dt { font-size: 13px; color: var(--ink-2); }
.p-rx dd { margin: 0; font-weight: 750; font-size: 18px; font-variant-numeric: tabular-nums; }
.p-cues { margin: 8px 0 0; padding-left: 22px; font-size: 18px; }
.p-level { margin: 2px 0 8px; font-size: 15px; color: var(--ink-2); line-height: 1.4; }
.p-level .k { color: var(--ink); }
.p-rx .rx-warn { flex: 1 1 100%; background: var(--warn-bg); }
.p-rx .rx-warn dd { color: var(--warn); font-size: 16px; font-weight: 650; }
.p-cues li { margin: 0 0 4px; }
.p-how-inline { margin: 12px 0 0; font-size: 18px; max-width: 60ch; }
.p-note { margin: 12px 0 0; padding: 12px 14px; border-radius: 10px; background: var(--hiper-bg); font-size: 17px; }
.p-note.warn { background: var(--warn-bg); color: var(--warn); font-weight: 650; }
.p-upnext { display: flex; flex-direction: column; gap: 2px; margin: 14px 0 0; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.p-upnext b { font-size: 20px; }
.p-upnext span:not(.k) { color: var(--ink-2); }
.kbox { margin: 14px 0 0; }
.kopts { margin-top: 8px; padding: 12px; border-radius: 10px; background: var(--bad-bg); display: flex; flex-wrap: wrap; gap: 8px; }
.kopts[hidden] { display: none; }
.kopts p { width: 100%; margin: 0; color: var(--bad); font-weight: 650; }
.metro { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 14px 0 6px; }
.m-bpm { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; font-weight: 750; font-size: 18px; }
.p-how { margin: 14px 0 0; }
.p-how summary { cursor: pointer; font-weight: 700; color: var(--accent); }
.p-how > div { padding-top: 8px; max-width: 64ch; }
.p-how p { margin: 0 0 8px; }
.p-bottom { max-width: 860px; width: 100%; margin: 0 auto; padding: 8px 16px 12px; border-top: 1px solid var(--line); background: var(--bg); }
.p-log { margin: 0 0 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.p-log[hidden] { display: none; }
.lg-name { margin: 0 0 6px; font-size: 14px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lg-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.lg-l { font-size: 14px; font-weight: 650; color: var(--ink-2); margin: 0 2px 0 6px; }
.lg-l:first-child { margin-left: 0; }
.lg-v { min-width: 34px; text-align: center; font-stretch: 72%; font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
.rir { min-width: 40px; min-height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-weight: 750; cursor: pointer; }
.rir.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.p-next { margin: 0 0 8px; font-size: 15px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-ctrls { display: grid; grid-template-columns: 1fr 2fr 1fr 1fr; gap: 8px; }
.p-ctrls .big { min-height: 60px; font-size: 20px; font-weight: 800; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.p-ctrls [hidden] { visibility: hidden; display: block; }
.p-keys { margin: 8px 0 0; font-size: 12px; color: var(--ink-2); text-align: center; }
.t-done .p-title { color: var(--ok); }
.fin { max-width: 64ch; }
.fin-lead { margin: 14px 0 4px; font-size: 19px; font-weight: 650; }
.fin-sets { margin: 16px 0 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.fin-sets summary { cursor: pointer; font-weight: 700; color: var(--accent); }
.fs-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.fs-name { font-weight: 650; font-size: 15px; }
.fs-vals { display: flex; flex-wrap: wrap; gap: 6px; }
.fs-vals label { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--ink-2); }
.fs-in { width: 52px; min-height: 40px; padding: 4px; text-align: center; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.fs-in.auto { border-style: dashed; color: var(--ink-2); font-weight: 400; }
.fin-sets .btn { margin-top: 10px; }
.tonight { margin: 14px 0 0; padding: 12px 14px; border-radius: 10px; background: var(--hiper-bg); }
.tonight p { margin: 0 0 6px; }
.tonight p:last-child { margin: 0; }

@media (max-width: 600px) {
  body { font-size: 16px; }
  .top-in { padding: 8px 10px 8px; }
  main, .global { padding: 0 14px; }

}

}

var EST = { over: 8, side: 6, lead: 3, pos: 5, step: 1.2, item: 30 };

}

function stepEst(st) {

  if (st.type === "work") {
    if (x.unit === "pasos") return repsMid(x.reps) * EST.step + (st.side ? EST.side : EST.over);
    var per = repsMid(x.reps) * repSec(x.tempo);
    return per + (st.side ? EST.side : EST.over);

  if (st.type === "rest" || st.type === "gap") return st.dur;

  if (st.type === "item") return st.item.est || EST.item;

/* ===================== Construcción del plan =====================

function halfUp(n) { return Math.max(1, Math.ceil(n / 2)); }

    var steps = stepsForBlock(b, opts);

    var est = steps.reduce(function (a, s) { return a + stepEst(s); }, 0);
    var estStd = stdSteps.reduce(function (a, s) { return a + stepEst(s); }, 0);
    var docLen = (b.end != null && b.start != null) ? b.end - b.start : null;
    var len;

      s.planAt = Math.round(o.start + (o.len * acc / tot));

function stepsForBlock(b, opts) {

/* ===================== Guía de tempo ===================== */
var PC = { running: false, paused: false, t0: 0, pauseAt: 0, pausedTotal: 0, phases: [], cycle: 0, lead: 3, reps: 0, key: -1, timer: null, top: 0, lastLead: 4 };
function pacerEligible(st) { return pref("tempo", false) && st && st.type === "work" && st.ex.pacer !== false && st.ex.unit !== "pasos" && !!tempoParts(st.ex.tempo); }

  PC.cycle = PC.phases.reduce(function (a, q) { return a + q.dur; }, 0) || 1;
  PC.running = true; PC.paused = false; PC.t0 = performance.now(); PC.pausedTotal = 0; PC.reps = 0; PC.key = -1; PC.sec = 0; PC.lead = lead || 3; PC.lastLead = PC.lead + 1;
  PC.top = repsRange(st.ex.reps)[1];

  if (PC.timer) clearInterval(PC.timer);
  PC.timer = setInterval(pacerTick, 30);
  pacerTick();
}
function pacerStop() { var r = PC.reps; if (PC.timer) clearInterval(PC.timer); PC.timer = null; var was = PC.running; PC.running = false; PC.paused = false; return was ? r : null; }

  var reps = Math.floor(t / PC.cycle), inC = t - reps * PC.cycle, acc = 0, ph = 0;
  for (ph = 0; ph < PC.phases.length - 1; ph++) { if (inC < acc + PC.phases[ph].dur) break; acc += PC.phases[ph].dur; }
  var q = PC.phases[ph], inPh = inC - acc, newRep = reps !== PC.reps, words = pref("tempoWords", true);
  if (newRep) { PC.reps = reps; snd(reps === PC.top ? "top" : "rep"); }
  var key = reps * 10 + ph;
  if (key !== PC.key) {
    PC.key = key; PC.sec = 0;
    if (!newRep) snd(q.kind);
    var txt = "";
    if (newRep && reps > 0) txt = reps === PC.top ? reps + ". Tope del rango." : String(reps);
    if (words && q.dur >= 2 && !(newRep && reps === PC.top)) txt += (txt ? ". " : "") + q.name;
    if (txt) say(txt, true);
  } else if (q.dur >= 2) { var sec = Math.floor(inPh); if (sec > PC.sec) { PC.sec = sec; snd("tick"); } }

}
function paintPacer(ph, lead, frac) {

    '<div class="pc-ph ' + (q ? q.kind : "") + '"><b>' + (q ? esc(q.name) : "…") + '</b><i style="width:' + Math.round(clamp(frac, 0, 1) * 100) + '%"></i></div>' +
    '<p class="pc-done">Hechas: ' + PC.reps + (PC.top ? " de " + PC.top : "") + "</p>";

/* ===================== Registro de series ===================== */
function logSet(e) {
  var i = P.log.findIndex(function (z) { return z.x === e.x && z.s === e.s && (z.side || 0) === (e.side || 0); });
  if (i >= 0) { if (P.log[i].rir != null && e.rir == null) e.rir = P.log[i].rir; P.log[i] = e; } else P.log.push(e);
  P.lastLog = e; saveRun();
}
function logWork(st, reps, force) {
  var x = st.ex, e = { x: x.id, code: x.code, s: st.round, n: st.rounds, side: st.side || 0, lvl: x.rung, auto: true };
  if (x.unit === "pasos") e.r = repsRange(x.reps)[1];
  else if (reps != null && reps > 0) { e.r = reps; e.auto = false; }
  else e.r = repsMid(x.reps);
  var cr = x.unit === "pasos" ? null : camTake(st);
  if (cr) { if (!force) e.r = cr.reps; e.auto = false; e.q = cr.q; }

}
function logHold(st, secs) { logSet({ x: st.ex.id, code: st.ex.code, s: st.round, n: st.rounds, side: st.side || 0, lvl: st.ex.rung, t: Math.round(secs), auto: false }); }

  if (!show) { el.hidden = true; return; }
  var st = P.steps[P.idx];
  if (inl && st && (st.type === "rest" || st.type === "gap" || st.type === "wait") && lastWorkIs(e)) { inl.innerHTML = logEditorHTML(e, "Anota la serie que terminaste"); el.hidden = true; return; }
  el.innerHTML = logLineHTML(e) + (P.lgOpen ? logEditorHTML(e, "") : "");
  el.hidden = false;
}
function editLog(d) {
  var e = P.lastLog; if (!e) return;
  if (e.t != null) e.t = Math.max(0, e.t + d * 5); else e.r = Math.max(0, (e.r || 0) + d);
  e.auto = false; saveRun(); renderLogBar();

/* ===================== Botones, conteo y reloj ===================== */
function updateButtons() {
  var st = P.steps[P.idx], main = $("p-main"), plus = $("p-plus"), pause = $("p-pause"), prev = $("p-prev");
  if (P.done) { main.textContent = "Cerrar"; plus.hidden = true; pause.hidden = true; prev.hidden = true; return; }
  pause.hidden = false; prev.hidden = false;
  pause.textContent = P.paused ? "Seguir" : "Pausa";
  if (st.type === "work") main.textContent = pacerEligible(st) && !PC.running ? "Empezar serie" : "Hecho";
  else if (st.type === "item") main.textContent = "Hecho";
  else if (needsStart(st) && !P.running) main.textContent = "Empezar";
  else if (st.type === "wait") main.textContent = "Empezar ya";
  else if (st.type === "hold" || st.type === "itemhold" || st.type === "phase") main.textContent = "Terminar";
  else if (st.type === "seg") main.textContent = "Siguiente";
  else main.textContent = "Saltar";
  plus.hidden = !(st.type === "rest" || st.type === "gap" || (st.type === "seg" && P.running));
}
function updateCount() {
  var st = P.steps[P.idx], c = $("p-count");
  if (P.done || !st) { c.textContent = ""; c.className = "p-count empty"; return; }
  if (st.type === "work" || (st.type === "item" && !P.autoItem)) { c.textContent = ""; c.className = "p-count empty"; return; }
  var r = P.remaining, lead = needsStart(st) && P.running && st.dur && r > st.dur;
  if (lead) { c.textContent = Math.ceil(r - st.dur); c.className = "p-count lead"; return; }
  c.className = "p-count" + (P.running ? "" : " idle");
  c.textContent = fmt(Math.max(0, Math.ceil(r)));
}
function updateClock() {
  $("p-el").textContent = fmt(P.elapsed);
  $("p-plan").textContent = "de " + fmt(P.total);
  var st = P.steps[P.idx], status = $("p-status");
  if (P.kind === "session" && st && st.blockPlan && !P.done) {
    var bp = st.blockPlan, late = P.elapsed - bp.end;
    if (st.type === "wait") { status.textContent = "Esperando el minuto exacto"; status.className = "p-status ok"; }
    else if (late > 15) { status.textContent = "Vas " + fmt(late) + " atrasado respecto al bloque " + bp.b.label; status.className = "p-status late"; }
    else if (P.elapsed < bp.start - 60) { status.textContent = "Vas " + fmt(bp.start - P.elapsed) + " adelantado"; status.className = "p-status early"; }
    else { status.textContent = "En tiempo"; status.className = "p-status ok"; }
  } else { status.textContent = P.done ? "" : P.kind === "seg" ? "Segmento " + (P.idx + 1) + " de " + P.steps.length : ""; status.className = "p-status"; }

  if (mk) mk.style.left = "calc(16px + (100% - 32px) * " + Math.min(1, P.elapsed / (P.total || 1)).toFixed(4) + ")";
  var segs = document.querySelectorAll("#p-route .seg");
  for (var i = 0; i < segs.length; i++) {
    var on = P.kind === "seg" ? +segs[i].getAttribute("data-i") === P.idx : !!(st && st.block && segs[i].getAttribute("data-b") === st.block.id);

function mark(k) { if (P.marks[k]) return false; P.marks[k] = true; return true; }
function tick() {

    if (P.remaining <= 0) { snd("end"); enterStep(P.idx + 1); return; }
    updateCount(); updateClock(); return;
  }
  if (st.type === "wait") P.remaining = st.target - P.elapsed;
  else if (P.running && isTimed(st)) P.remaining -= dt;
  if (P.running && isTimed(st)) {
    var r = Math.ceil(P.remaining);
    if (needsStart(st) && st.dur && P.remaining > st.dur) {
      var l = Math.ceil(P.remaining - st.dur);
      if (l <= 3 && mark("L" + l)) { snd("count"); say(String(l), true); }
    } else if (needsStart(st) && st.dur && mark("go")) {

}
function mainAction() {
  if (P.done) { closePlayer(); return; }
  var st = P.steps[P.idx]; audio();
  var ld = P.leadNext || 0; P.leadNext = 0;
  if (st.type === "work") {
    if (pacerEligible(st) && !PC.running) { pacerStart(st, ld || 3); updateButtons(); return; }
    var reps = pacerStop();
    logWork(st, reps);
    enterStep(P.idx + 1); return;
  }
  if (st.type === "item") { enterStep(P.idx + 1); return; }
  if (needsStart(st) && !P.running) {
    P.running = true; P.remaining = st.dur + (ld || 3); P.marks = {};
    if (P.paused) togglePause();
    updateButtons(); updateCount(); return;
  }
  if (st.type === "hold" && P.running) { var held = st.dur - Math.max(0, P.remaining); logHold(st, clamp(held, 0, st.dur)); }

}

  if (PC.running) { if (P.paused) PC.pauseAt = now; else PC.pausedTotal += now - PC.pauseAt; PC.paused = P.paused; }
  if (P.paused) metro.stop();

  var cb = $("p-camb"); if (cb) { cb.setAttribute("aria-pressed", CAM.on); cb.textContent = "Cámara"; cb.hidden = !(P.kind === "session" || P.kind === "routine"); }

/* ===================== Molestia de rodilla durante la sesión ===================== */
function kneeStop(why) {
  var st = P.steps[P.idx]; if (!st || !st.ex) return;
  var id = st.ex.id, name = st.ex.name;
  pacerStop();
  P.flags.push({ x: id, why: why, s: st.round });
  logSet({ x: id, code: st.ex.code, s: st.round, side: st.side || 0, lvl: st.ex.rung, skip: true, r: null });
  P.lastLog = null;
  P.steps = dropExercise(P.steps, P.idx + 1, id);
  P.notice = "Cortamos " + name + " por hoy. La próxima vez baja un peldaño; la página ya lo marcó.";
  speak("Cortamos " + name + ". Pasa a lo siguiente.");
  enterStep(P.idx + 1);
}

/* ===================== Final ===================== */
function improvements() {
  var out = [];
  uniq(P.log.filter(function (e) { return !e.skip && !e.auto; }).map(function (e) { return e.x; })).forEach(function (id) {
    var today = P.log.filter(function (e) { return e.x === id && !e.skip; });
    var tv = perSet(today).filter(function (p) { return !p.auto; }).map(function (p) { return p.v; });
    if (!tv.length) return;
    var best = Math.max.apply(null, tv);
    var prev = historyOf(id, 4).filter(function (h) { return h.d !== P.date && h.lvl === today[0].lvl; })[0];
    if (!prev) return;
    var pv = perSet(prev.sets).filter(function (p) { return !p.auto; }).map(function (p) { return p.v; });
    if (!pv.length) return;
    var pb = Math.max.apply(null, pv);
    if (best > pb) out.push((EX[id] || {}).name + ": " + best + (today[0].t != null ? " s" : "") + " (antes " + pb + ")");
  });
  return out;
}
function saveResult(done) {

  if (P.kind === "session") {
    if (D.type === "aero") put({ id: "aer_" + P.date, k: "aer", d: P.date, type: "A", dur: dur, plan: Math.round(P.total), done: done, knee: P.kneeAfter, feel: P.feel });
    else put({ id: "log_" + P.date + "_" + P.key, k: "log", d: P.date, day: P.key, mode: P.plan.opts.mode, deload: P.plan.opts.deload, dur: dur, plan: Math.round(P.total), done: done, planSets: P.plannedSets, sets: P.log, flags: P.flags, knee: P.kneeAfter });
  } else if (P.kind === "seg") {
    if (P.seg === "walk") put({ id: "walk_" + P.date, k: "walk", d: P.date, dur: dur, done: done });
    else put({ id: "aer_" + P.date, k: "aer", d: P.date, type: P.seg === "hill" ? "B" : "F2", dur: dur, plan: Math.round(P.total), done: done, knee: P.kneeAfter, feel: P.feel });
  } else if (P.kind === "routine") put({ id: "rut_" + P.date + "_" + P.routine.id, k: "rut", d: P.date, r: P.routine.id, dur: dur });
}

}

/* ===================== 1. Mis mancuernas ===================== */
var EQ_DEF = { discs: [{ kg: 2.5, n: 4 }, { kg: 1.25, n: 4 }, { kg: 0.5, n: 4 }], bar: 1.5, antigua: 5, vinilo: 1, guard: 7.5 };

  var e = pref("equip", null);

    if (!e.discs.some(function (d) { return Math.abs(+d.kg - 0.5) < 0.001; })) { e = JSON.parse(JSON.stringify(e)); e.discs.push({ kg: 0.5, n: 4 }); setPref("equip", e); }

  var d = src.discs.map(function (x) { return { kg: +x.kg, n: Math.max(0, Math.floor(+x.n || 0)) }; }).filter(function (x) { return x.kg > 0; });

}

  var r = Math.round(v * 100) / 100, i = Math.floor(r), f = Math.round((r - i) * 100);

/* Lee una carga escrita con el vocabulario nuevo. Devuelve null si no hay pesas. */
function eqParse(t) {
  var low = String(t || "").toLowerCase(), s = { kind: null, kg: null, all: false, moch: null }, m;
  if (/todos los discos/.test(low)) { s.kind = "una"; s.all = true; }
  else if (/2 principales sin discos/.test(low)) { s.kind = "par"; s.kg = 0; }
  else if ((m = low.match(/2 principales[^0-9]*([\d.]+)\s*kg/))) { s.kind = "par"; s.kg = parseFloat(m[1]); }
  else if ((m = low.match(/1 principal[^0-9]*([\d.]+)\s*kg/))) { s.kind = "una"; s.kg = parseFloat(m[1]); }
  else if (/antigua/.test(low)) s.kind = "antigua";
  else if (/vinilo/.test(low)) s.kind = "vinilos";

  else if ((m = low.match(/mochila(?: de)? ?([\d.]+)\s*kg/))) s.moch = parseFloat(m[1]);

/* Combina discos por lado. sides = 4 para el par (2 mancuernas × 2 lados) y 2 para una sola. */
function eqSolve(perSide, sides, inv) {

function stable(v) {
  if (v === null || typeof v !== "object") return JSON.stringify(v === undefined ? null : v);
  if (Array.isArray(v)) return "[" + v.map(stable).join(",") + "]";
  return "{" + Object.keys(v).filter(function (k) { return v[k] !== undefined; }).sort().map(function (k) { return JSON.stringify(k) + ":" + stable(v[k]); }).join(",") + "}";
}
function seq(list, fn) { return list.reduce(function (p, x) { return p.then(function () { return fn(x); }); }, Promise.resolve()); }
function b64enc(str) {
  var bytes = new TextEncoder().encode(String(str)), bin = "", CH = 0x8000;
  for (var i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(bin);
}

  var bin = atob(String(b || "").replace(/\s/g, "")), n = bin.length, a = new Uint8Array(n);
  for (var i = 0; i < n; i++) a[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(a);
}

function agoText(t) {
  if (!t) return "nunca";
  var s = Math.round((Date.now() - t) / 1000);

/* ---------- Voz que no espera a que termine la respuesta ----------
   Lee cada frase apenas está completa: la primera llega en 1-2 segundos. */
function sayQueue(t) {
  if (!voiceOn() || !window.speechSynthesis || typeof SpeechSynthesisUtterance === "undefined") return;
  var s = cleanSpeech(t); if (!s) return;
  try {
    var u = new SpeechSynthesisUtterance(s), v = esVoice(), rate = +pref("vozRate", 1.05) || 1.05, now = Date.now();
    if (v) u.voice = v; u.lang = v ? v.lang : "es-ES"; u.rate = rate; u.volume = 1;
    SAY.last = (SAY.until > now ? SAY.last + " " : "") + s; SAY.lastT = now;
    SAY.until = Math.max(SAY.until, now) + 700 + s.length * 70 / rate;
    u.onend = function () { try { if (!speechSynthesis.pending && !speechSynthesis.speaking) SAY.until = Math.min(SAY.until, Date.now() + 300); } catch (e) {} };
    speechSynthesis.speak(u);
  } catch (e) {}
}

  var off = 0, first = true;
  return function (full, done) {
    var txt = aiClean(full), rest = txt.slice(off), idx = -1, m, re = /([.!?…;:]+["»”)]*)(\s+)|\n+/g;
    while ((m = re.exec(rest))) idx = m.index + m[0].length;
    if (done) idx = rest.length;
    if (idx <= 0) return;
    var chunk = rest.slice(0, idx).trim(); off += idx;

/* ---------- Plan del lunes con tercera ronda del circuito D (regla del 3.0 para brazos) ---------- */
function lunD3Plan(D) {
  var out = {}, k; for (k in D) out[k] = D[k];
  var add = 0, bl = [];
  D.blocks.forEach(function (b) {
    var c = {}, kk; for (kk in b) c[kk] = b[kk];
    if (add && c.start != null) { c.start += add; c.end += add; }
    if (b.id === "D" && b.kind === "circuit") {
      var len = b.end - b.start; add = Math.round(len / b.rounds / 15) * 15;
      c.rounds = b.rounds + 1; c.end = b.end + add;
      c.ex = b.ex.map(function (e) { var z = {}, q; for (q in e) z[q] = e[q]; z.sets = (e.sets || b.rounds) + 1; return z; });
    }
    bl.push(c);
  });
  out.blocks = bl;
  var m = String(D.window || "").match(/^(\d{1,2}):(\d{2})/);
  if (m) { var end = (+m[1]) * 60 + (+m[2]) + Math.round((bl[bl.length - 1].end || 0) / 60); out.window = m[1] + ":" + m[2] + " a " + Math.floor(end / 60) + ":" + String(end % 60).padStart(2, "0"); }
  return out;
}
